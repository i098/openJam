[workspace]
resolver = "3"
members = ["crates/core", "crates/engines", "crates/api", "crates/worker", "crates/runner", "crates/mcp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
openjam-core = { path = "crates/core" }
openjam-engines = { path = "crates/engines" }
openjam-mcp = { path = "crates/mcp" }
async-trait = "0.1"
chrono-tz = "0.10"
hmac = "0.12"
tower = { version = "0.5", features = ["util"] }
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
futures-util = "0.3"
axum-extra = { version = "0.10", features = ["cookie"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
subtle = "2"
tempfile = "3"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "uuid", "chrono", "json", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "process", "io-util", "sync"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "propagate-header", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid", "yaml"] }
utoipa-axum = "0.2"
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
