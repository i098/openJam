name: openjam

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openjam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openjam}
      POSTGRES_DB: openjam
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openjam -d openjam"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgres://openjam:${POSTGRES_PASSWORD:-openjam}@db:5432/openjam
      OPENJAM_ALLOW_SIGNUP: ${OPENJAM_ALLOW_SIGNUP:-true}
      OPENJAM_COOKIE_SECURE: ${OPENJAM_COOKIE_SECURE:-false}
      OPENJAM_SESSION_DAYS: ${OPENJAM_SESSION_DAYS:-30}
      # No scan limit by default. Set a number to cap scans per UTC day, per workspace.
      OPENJAM_SCAN_CAP_PER_DAY: ${OPENJAM_SCAN_CAP_PER_DAY:-}
      OPENJAM_LOG_FORMAT: ${OPENJAM_LOG_FORMAT:-json}
      OPENJAM_GITHUB_APP_ID: ${OPENJAM_GITHUB_APP_ID:-}
      OPENJAM_GITHUB_APP_PRIVATE_KEY: ${OPENJAM_GITHUB_APP_PRIVATE_KEY:-}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["openjam-worker"]
    environment:
      DATABASE_URL: postgres://openjam:${POSTGRES_PASSWORD:-openjam}@db:5432/openjam
      OPENJAM_SCAN_CAP_PER_DAY: ${OPENJAM_SCAN_CAP_PER_DAY:-}
      RUST_LOG: ${RUST_LOG:-info}
      RUNNER_SHARED_SECRET: ${RUNNER_SHARED_SECRET:-}
      OPENJAM_RUNNER_URL: http://runner:8080
      OPENJAM_GITHUB_APP_ID: ${OPENJAM_GITHUB_APP_ID:-}
      OPENJAM_GITHUB_APP_PRIVATE_KEY: ${OPENJAM_GITHUB_APP_PRIVATE_KEY:-}
    volumes:
      - secrets:/var/lib/openjam
    networks:
      - default
      - runner-net
    depends_on:
      api:
        condition: service_healthy

  # Runs the unmodified Claude Code CLI for Claude plan accounts. Off by default:
  #   RUNNER_SHARED_SECRET=... OPENJAM_CLAUDE_VERSION=<pinned version> docker compose --profile claude up -d --build
  # Sign a subscription in: docker compose --profile claude run --rm -it runner claude-login "<label>"
  runner:
    profiles: ["claude"]
    build:
      context: .
      dockerfile: Dockerfile.runner
      args:
        OPENJAM_CLAUDE_VERSION: ${OPENJAM_CLAUDE_VERSION:-}
    environment:
      RUNNER_SHARED_SECRET: ${RUNNER_SHARED_SECRET:-}
      RUNNER_MAX_RUN_SECS: 120
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - claude-logins:/claude-logins
    networks:
      - runner-net
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: web
    ports:
      - "${OPENJAM_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  # The key that seals engine secrets. Back it up: without it, saved API keys and sign-ins do not open.
  secrets:
  # One folder per Claude subscription login. Only the runner mounts it.
  claude-logins:

networks:
  # The worker and the runner only. The runner has no published port and no database.
  runner-net:
