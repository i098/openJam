                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/brand/recalibrations:
    post:
      tags:
      - Brand
      summary: Post /v1/brand/recalibrations (not built yet)
      operationId: recalibrate_brand
      responses:
        '501':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/content:
    get:
      tags:
      - Content
      summary: List content
      operationId: list_content
      parameters:
      - name: state
        in: query
        description: 'Only content in these states: `drafted`, `discarded`, or both separated by a comma.'
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Items per page, 1 to 100. The default is 100.
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        description: '`pageInfo.nextCursor` of the page before.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentList'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
    post:
      tags:
      - Content
      summary: Store a draft
      operationId: create_content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContent'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedContent'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/content/{contentId}:
    get:
      tags:
      - Content
      summary: Get content
      operationId: get_content
      parameters:
      - name: contentId
        in: path
        description: The content item
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItem'
        '401':
          description: ''
