      - submit
      properties:
        articlePlan:
          description: '`null` for a page update, or when no plan was stored.'
        creditsCharged:
          type: integer
          format: int32
          description: 'Always 0: the plan comes with the research.'
        delivery:
          description: The destination of the article. `null` until the project has one.
        intent:
          type: string
        kind:
          type: string
        opportunityId:
          type: string
          format: uuid
        persona:
          type: string
        planUnavailable:
          type:
          - string
          - 'null'
        rationale:
          type: string
        research:
          $ref: '#/components/schemas/BriefResearch'
        submit:
          $ref: '#/components/schemas/Submit'
        targetPrompts:
          type: array
          items:
            type: string
          description: The questions users ask that this article should answer.
        title:
          type: string
        topic:
          type: string
        voice:
          $ref: '#/components/schemas/Voice'
    OpportunityDetail:
      allOf:
      - $ref: '#/components/schemas/Opportunity'
      - type: object
        required:
        - prompts
        - demandQueries
        properties:
          demandQueries:
            type: array
            items: {}
            description: 'Always empty: openJam has no demand queries.'
          prompts:
            type: array
            items:
              $ref: '#/components/schemas/EvidencePrompt'
    PageInfo:
      type: object
      required:
      - limit
      - hasNextPage
      - totalCount
      properties:
        hasNextPage:
          type: boolean
        limit:
          type: integer
          format: int64
        nextCursor:
          type:
          - string
          - 'null'
        totalCount:
          type: integer
          format: int64
          minimum: 0
    PlatformBreakdownRow:
      type: object
      required:
      - providerId
      - visibilityScore
      - shareOfVoice
      - citationShare
      - averagePosition
      - answerCount
      - status
      properties:
        answerCount:
          type: integer
          format: int64
          minimum: 0
        averagePosition:
          $ref: '#/components/schemas/MetricValue'
        citationShare:
          $ref: '#/components/schemas/MetricValue'
        providerId:
          type: string
        shareOfVoice:
          $ref: '#/components/schemas/MetricValue'
        status:
          type: string
        visibilityScore:
          $ref: '#/components/schemas/MetricValue'
    ProjectList:
      type: object
      required:
      - projects
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
    ProjectSummary:
      type: object
      required:
      - id
      - name
      - domain
      - siteUrl
      - status
      - createdAt
      properties:
        createdAt:
          type: string
          format: date-time
        domain:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
        siteUrl:
          type: string
        status:
          type: string
          description: '`setup`, `active`, `paused` or `blocked`.'
    PromptAnalytics:
      type: object
      required:
      - project
      - window
      - providers
      - metricDefinitions
      - prompts
      - filters
      - pageInfo
      properties:
        filters:
          $ref: '#/components/schemas/PromptFilters'
        metricDefinitions:
          $ref: '#/components/schemas/MetricDefinitions'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
        project:
          $ref: '#/components/schemas/AnalyticsProject'
        prompts:
          type: array
          items:
            $ref: '#/components/schemas/PromptRow'
        providers:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsPlatform'
        window:
          $ref: '#/components/schemas/AnalyticsWindow'
    PromptFilters:
      type: object
      properties:
        intent:
          type:
          - string
          - 'null'
        platform:
          type:
          - string
          - 'null'
        query:
          type:
          - string
          - 'null'
        topic:
          type:
          - string
          - 'null'
    PromptMetrics:
      type: object
      required:
      - visibilityScore
      - shareOfVoice
      - averagePosition
      - citationShare
      - executions
      properties:
        averagePosition:
          $ref: '#/components/schemas/MetricValue'
        citationRank:
          type:
          - integer
          - 'null'
          format: int64
        citationShare:
          $ref: '#/components/schemas/MetricValue'
        executions:
          type: integer
          format: int64
          minimum: 0
        shareOfVoice:
          $ref: '#/components/schemas/MetricValue'
        visibilityRank:
          type:
          - integer
          - 'null'
          format: int64
        visibilityScore:
          $ref: '#/components/schemas/MetricValue'
    PromptRow:
      type: object
      required:
      - id
      - text
      - metrics
      properties:
        id:
          type: string
          format: uuid
        intent:
          type:
          - string
          - 'null'
        metrics:
          $ref: '#/components/schemas/PromptMetrics'
        persona:
          type:
          - string
          - 'null'
        text:
          type: string
        topic:
          type:
          - string
          - 'null'
    QuietHours:
      type: object
      required:
      - start
      - end
      - timezone
      properties:
        end:
          type: string
          description: Local time, `HH:MM`. Earlier than `start` means the window crosses midnight.
        start:
          type: string
          description: Local time, `HH:MM`.
        timezone:
          type: string
          description: An IANA zone, for example `Europe/Berlin`.
    ReportAction:
      type: object
      required:
      - id
      - kind
      - problem
      - status
      - title
      - why
      - details
      - impact
      - rank
      - sources
      - questions
      properties:
        details:
          type: array
          items:
            type: string
        id:
          type: string
          format: uuid
        impact:
          type: string
        kind:
          type: string
        problem:
          type: string
        questions: {}
        rank:
          type: integer
          format: int32
        sources:
          type: array
          items:
            type: string
        status:
          type: string
        targetUrl:
          type:
          - string
          - 'null'
        title:
          type: string
        why:
          type: string
    ResearchReport:
      type: object
      required:
      - runId
      - finishedAt
      - actions
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ReportAction'
        actionsProposed:
          type:
          - integer
          - 'null'
          format: int32
          description: Proposals before two of the same work were merged.
        answersRead:
          type:
          - integer
          - 'null'
          format: int32
        finishedAt:
          type: string
          format: date-time
        runId:
          type: string
          format: uuid
    ResearchReportResult:
      type: object
      properties:
        report:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ResearchReport'
            description: '`null` before any run succeeded.'
    ResearchRequest:
      type: object
      required:
      - status
      - requestId
      - charged
      - credits
      properties:
        charged:
          type: boolean
        credits:
          type: integer
          format: int32
        requestId:
          type: string
          format: uuid
        status:
          type: string
    ResearchState:
      type: object
      required:
      - state
      - manual
      - automaticTopUp
      properties:
        automaticTopUp:
          $ref: '#/components/schemas/AutomaticTopUp'
          description: Jam's own re-run. openJam starts only the first run by itself.
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
        inFlight:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/InFlightRun'
            description: The run in flight, if any. A run takes about ten minutes.
        latest:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/LatestRun'
            description: The last run that ended.
        manual:
          $ref: '#/components/schemas/ManualResearch'
          description: Research again, by hand.
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
        state:
          type: string
          description: '`never`, `running`, `done` or `failed`.'
    StartConnect:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: Shown on the approval page, for example `Claude Code`.
    Submit:
      type: object
      required:
      - method
      - path
      - body
      properties:
        body: {}
        method:
          type: string
        path:
          type: string
    TopicRanking:
      type: object
      required:
      - topic
      - promptCount
      - answerCount
      - visibilityScore
      properties:
        answerCount:
          type: integer
          format: int64
          minimum: 0
        promptCount:
          type: integer
          format: int64
          minimum: 0
        topic:
          type: string
        visibilityScore:
          $ref: '#/components/schemas/MetricValue'
    TrendPoint:
      type: object
      required:
      - date
      - scores
      properties:
        date:
          type: string
          description: UTC day, `YYYY-MM-DD`.
        scores:
          type: object
          description: Mention rate of each brand on that day, by brand key.
          additionalProperties:
            type: number
            format: double
          propertyNames:
            type: string
    TrendSeries:
      type: object
      required:
      - brands
      - points
      - unit
      properties:
        brands:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsBrand'
        points:
          type: array
          items:
            $ref: '#/components/schemas/TrendPoint'
        unit:
          type: string
    UpdateNotificationRule:
      type: object
      properties:
        batchWindowMinutes:
          type:
          - integer
          - 'null'
          format: int32
        batchingEnabled:
          type:
          - boolean
          - 'null'
        channels:
          type:
          - array
          - 'null'
          items:
            type: string
        isActive:
          type:
          - boolean
          - 'null'
        quietHours:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/QuietHours'
            description: An object sets quiet hours. `null` clears them. Leave it out to keep them.
    UpdateWebhook:
      type: object
      properties:
        enabled:
          type:
          - boolean
          - 'null'
        name:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
    Usage:
      type: object
      required:
      - scans_today
      - cost_cents_today
      - cost_cents_month
      properties:
        cost_cents_month:
          type: number
          format: double
        cost_cents_today:
          type: number
          format: double
        scan_cap_per_day:
          type:
          - integer
          - 'null'
          format: int32
          description: '`null` when no cap is set. The default is no cap.'
          minimum: 0
        scans_today:
          type: integer
          format: int64
          description: Scans started in the current UTC day.
    Voice:
      type: object
      required:
      - brand
      - language
      properties:
        brand:
          $ref: '#/components/schemas/BrandVoice'
        language:
          $ref: '#/components/schemas/Language'
    Webhook:
      type: object
      required:
      - id
      - name
      - url
      - enabled
      - createdAt
      properties:
        createdAt:
          type: string
          format: date-time
        enabled:
          type: boolean
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
    WebhookList:
      type: object
      required:
      - webhooks
      properties:
        webhooks:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sk
