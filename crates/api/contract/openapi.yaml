openapi: 3.1.0
info:
  title: openJam API
  description: The `/v1` contract. Operations marked "not built yet" answer 501 until their slice lands.
  version: 0.1.0
servers:
- url: /
paths:
  /v1/action-completions/{token}:
    post:
      tags:
      - Actions
      summary: Post /v1/action-completions/{token} (not built yet)
      operationId: complete_action_with_token
      parameters:
      - name: token
        in: path
        description: Path parameter
        required: true
        schema:
          type: string
      responses:
        '501':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/actions:
    get:
      tags:
      - Actions
      summary: Get /v1/actions (not built yet)
      operationId: list_actions
      responses:
        '501':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/actions/{actionId}:
    get:
      tags:
      - Actions
      summary: Get /v1/actions/{actionId} (not built yet)
      operationId: get_action
      parameters:
      - name: actionId
        in: path
        description: Path parameter
        required: true
        schema:
          type: string
      responses:
        '501':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/actions/{actionId}/checks:
    post:
      tags:
      - Actions
      summary: Post /v1/actions/{actionId}/checks (not built yet)
      operationId: check_action_again
      parameters:
      - name: actionId
        in: path
        description: Path parameter
        required: true
        schema:
          type: string
      responses:
        '501':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/actions/{actionId}/completion:
    post:
      tags:
      - Actions
      summary: Post /v1/actions/{actionId}/completion (not built yet)
      operationId: complete_action
      parameters:
      - name: actionId
        in: path
        description: Path parameter
        required: true
        schema:
          type: string
      responses:
        '501':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/actions/{actionId}/dismissal:
    post:
      tags:
      - Actions
      summary: Post /v1/actions/{actionId}/dismissal (not built yet)
      operationId: dismiss_action
      parameters:
