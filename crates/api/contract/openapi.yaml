      operationId: report_action_sent
      parameters:
      - name: actionId
        in: path
        description: Path parameter
        required: true
        schema:
          type: string
      responses:
        '501':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/actions/{actionId}/start:
    post:
      tags:
      - Actions
      summary: Post /v1/actions/{actionId}/start (not built yet)
      operationId: start_action
      parameters:
      - name: actionId
        in: path
        description: Path parameter
        required: true
        schema:
          type: string
      responses:
        '501':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/agent-connect:
    post:
      tags:
      - Agent connect
      summary: Start an agent connect session
      operationId: start_agent_connect
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: 'null'
              - $ref: '#/components/schemas/StartConnect'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectStarted'
        '429':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
  /v1/agent-connect/{pollToken}:
    get:
      tags:
      - Agent connect
      summary: Poll an agent connect session
      operationId: get_agent_connect
      parameters:
      - name: pollToken
        in: path
        description: The `pollToken` from the start call
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectStatus'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
  /v1/analytics/metrics:
    get:
      tags:
      - Analytics
      summary: One metric family as flat rows, for charts
      operationId: list_analytics_metrics
      parameters:
      - name: metric
        in: query
        description: The metric family to flatten into rows.
        required: true
        schema:
          $ref: '#/components/schemas/MetricKind'
      - name: rangeDays
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: projectId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: platform
        in: query
        description: One engine, for example `openai`. Applies to `visibility`, `competitors`, `citations` and `topics`.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricRows'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/analytics/overview:
    get:
      tags:
      - Analytics
      summary: Visibility, share of voice, citations and position for a window
      operationId: get_analytics_overview
      parameters:
      - name: rangeDays
        in: query
        description: Days in the window, 1 to 365. The default is 30.
        required: false
        schema:
          type: integer
          format: int64
      - name: projectId
        in: query
        description: The project to measure. The default is the newest project.
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverview'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/analytics/prompts:
    get:
      tags:
      - Analytics
      summary: Metrics for each tracked prompt
      operationId: list_prompt_analytics
      parameters:
      - name: rangeDays
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: projectId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: Page size, 1 to 100. The default is 25.
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        description: '`nextCursor` of the page before.'
        required: false
        schema:
          type: string
      - name: intent
        in: query
        required: false
        schema:
          type: string
      - name: topic
        in: query
        required: false
        schema:
          type: string
      - name: platform
        in: query
        description: One engine, for example `openai`.
        required: false
        schema:
          type: string
      - name: query
        in: query
        description: Text the prompt contains. Case is ignored.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptAnalytics'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/answers:
    get:
      tags:
      - Answers
      summary: List answers
      operationId: list_answers
      parameters:
      - name: promptId
        in: query
        description: Only answers to this prompt.
        required: false
        schema:
          type: string
          format: uuid
      - name: platform
        in: query
        description: One engine, for example `openai`.
        required: false
        schema:
          type: string
      - name: since
        in: query
        description: Only answers observed at or after this time (RFC 3339).
        required: false
        schema:
          type: string
          format: date-time
      - name: until
        in: query
        description: Only answers observed at or before this time (RFC 3339).
        required: false
        schema:
          type: string
          format: date-time
      - name: cited
        in: query
        description: '`true`: answers that cite the project''s domain. `false`: answers that do not.'
        required: false
        schema:
          type: boolean
      - name: competitor
        in: query
        description: Only answers that mention this competitor.
        required: false
        schema:
          type: string
      - name: full
        in: query
        description: '`true`: the whole answer text. The default is a short excerpt.'
        required: false
        schema:
          type: boolean
      - name: limit
        in: query
        description: Page size, 1 to 100. The default is 25.
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        description: '`nextCursor` of the page before.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerPage'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/api-keys:
    get:
      tags:
      - API keys
      summary: List API keys
      operationId: list_api_keys
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyList'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
    post:
      tags:
      - API keys
      summary: Create an API key
      operationId: create_api_key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueApiKey'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedApiKey'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/api-keys/{keyId}:
    delete:
      tags:
      - API keys
      summary: Revoke an API key
      operationId: revoke_api_key
      parameters:
      - name: keyId
        in: path
        description: The key to revoke
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Revoked
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/billing:
    get:
      tags:
      - Billing
      summary: Get /v1/billing (not built yet)
      operationId: get_billing
      responses:
        '501':
          description: ''
