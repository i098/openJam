components:
  schemas:
    Accepted:
      type: object
      required:
      - status
      properties:
        status:
          type: string
    Action:
      type: object
      required:
      - id
      - kind
      - problem
      - title
      - why
      - impact
      - rank
      - status
      - lastSeenAt
      - executableByJam
      - nextStep
      properties:
        contentId:
          type:
          - string
          - 'null'
          format: uuid
          description: The content written for that opportunity, once there is any.
        executableByJam:
          type: boolean
          description: Whether `POST /v1/actions/{id}/executions` would have Jam do this now.
        id:
          type: string
          format: uuid
        impact:
          type: string
          description: '`high`, `medium` or `low`.'
        kind:
          type: string
          description: '`page_edit`, `new_page`, `outreach`, `technical` or `community`.'
        lastSeenAt:
          type: string
          format: date-time
        nextStep:
          type: string
          description: What to do with the action next.
        notExecutableReason:
          type:
          - string
          - 'null'
          description: |-
            Why not, when `executable_by_jam` is false: `closed`, `already_drafted`, `not_jam_work`,
            `needs_github`, `no_page`.
        opportunityId:
          type:
          - string
          - 'null'
          format: uuid
          description: The article opportunity behind the action, once Jam has one.
        problem:
          type: string
          description: The gap the action closes.
        rank:
          type: integer
          format: int32
          description: Priority within the Plan; 1 is first.
        status:
          type: string
        targetUrl:
          type:
          - string
          - 'null'
        title:
          type: string
        why:
          type: string
    ActionCheck:
      type: object
      properties:
        url:
          type:
          - string
          - 'null'
          description: The page to check, when it moved. Defaults to the last claim.
    ActionCompletion:
      type: object
      properties:
        note:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
          description: Where the finished work lives.
    ActionDetail:
      allOf:
      - $ref: '#/components/schemas/Action'
      - type: object
        required:
        - kindLabel
        - source
        - details
        - sources
        - questions
        - history
        - agentPrompt
        - firstSeenAt
        properties:
          agentPrompt:
            type: string
            description: Instructions for your agent, ending with how to report the work.
          change:
            description: Jam's prepared code change. Always null in this build.
          check:
            description: 'The latest check of a done claim: `{passed, evidence, url, at}`.'
          details:
            type: array
            items:
              type: string
            description: The evidence and specifics research found.
          firstSeenAt:
            type: string
            format: date-time
          history:
            type: array
            items:
              $ref: '#/components/schemas/HistoryEvent'
            description: Everything that happened to the action, oldest first.
          kindLabel:
            type: string
          questions:
            description: 'The tracked prompts this action should move: `{promptId, text}`.'
          source:
            type: string
            description: '`research`, `planner` or `user`.'
          sources:
            type: array
            items:
              type: string
            description: Pages research read for this action.
    ActionExecution:
      type: object
      required:
      - status
      - work
      properties:
        changeId:
          type:
          - string
          - 'null'
          format: uuid
        chatUrl:
          type:
          - string
          - 'null'
        opportunityId:
          type:
          - string
          - 'null'
          format: uuid
        runId:
          type:
          - string
          - 'null'
          format: uuid
        status:
          type: string
