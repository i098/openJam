                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
    delete:
      tags:
      - Actions
      summary: Delete /v1/actions/{actionId}/dismissal (not built yet)
      operationId: restore_action
      parameters:
      - name: actionId
        in: path
        description: Path parameter
        required: true
        schema:
          type: string
      responses:
        '501':
          description: ''
          content:
            application/json:
              schema:
