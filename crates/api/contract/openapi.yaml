openapi: 3.1.0
info:
  title: openJam API
  description: The `/v1` contract. Operations marked "not built yet" answer 501 until their slice lands.
  version: 0.1.0
servers:
- url: /
paths:
  /v1/action-completions/{token}:
    post:
      tags:
      - Actions
      summary: Report an action done with its token
      description: 'For the agent that did the work: the token in the action''s prompt reports that one action done. No API key needed.'
      operationId: complete_action_with_token
      parameters:
      - name: token
        in: path
        description: 'The token from the action''s prompt: `gac_` and 32 hex digits'
        required: true
        schema:
          type: string
          pattern: ^gac_[0-9a-f]{32}$
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionCompletion'
        required: true
      responses:
        '200':
          description: Reported
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
  /v1/actions:
    get:
      tags:
      - Actions
      summary: List the Plan
      description: 'The project''s Plan, highest priority first, with the count in each status. Superseded actions are left out unless `includeSuperseded=true` or `status` names them. Paged: `limit` (default 100, at most 100) and `cursor`; `countsByStatus` covers every page.'
      operationId: list_actions
      parameters:
      - name: status
        in: query
        description: One or more statuses, comma separated.
        required: false
        schema:
          type: string
      - name: kind
        in: query
        description: One or more kinds, comma separated.
        required: false
        schema:
          type: string
      - name: includeSuperseded
        in: query
        description: Also list actions a later research run no longer proposes.
        required: false
        schema:
          type: boolean
      - name: limit
        in: query
        description: Items per page, 1 to 100. The default is 100.
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        description: '`pageInfo.nextCursor` of the page before.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actions'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/actions/{actionId}:
    get:
      tags:
      - Actions
      summary: Get an action
      description: 'Everything to do one action: evidence (`details`, `sources`), prompts to move (`questions`), target page, history, latest check, and `agentPrompt` (instructions for your agent, ending with how to report the work).'
      operationId: get_action
      parameters:
      - name: actionId
        in: path
        description: The action id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionDetail'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/actions/{actionId}/checks:
    post:
      tags:
      - Actions
      summary: Check an action again
      description: 'Re-verify a `done` or `unverified` action: a new done claim (at `url`, else the last claim''s page) that Jam checks again. 409 when the action is not `done` or `unverified`.'
      operationId: check_action_again
      parameters:
      - name: actionId
        in: path
        description: The action id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionCheck'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionTransitionResult'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/actions/{actionId}/completion:
    post:
      tags:
      - Actions
      summary: Report an action done
      description: Report an action done, optionally with the URL of the finished work. Jam then checks the page once (status `done`, then `verified` or `unverified`). 409 for a dismissed or superseded action.
      operationId: complete_action
      parameters:
      - name: actionId
        in: path
        description: The action id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionCompletion'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionTransitionResult'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/actions/{actionId}/dismissal:
    post:
      tags:
      - Actions
      summary: Dismiss an action
      description: Take an open action off the Plan (status `dismissed`). `DELETE` restores it. Safe to repeat.
      operationId: dismiss_action
      parameters:
      - name: actionId
        in: path
        description: The action id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionTransitionResult'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
    delete:
      tags:
      - Actions
      summary: Restore a dismissed action
      description: 'Put a dismissed action back on the Plan, as it was before the dismissal. Safe to repeat on a restored action only through `409`: only a dismissed action can be restored.'
      operationId: restore_action
      parameters:
      - name: actionId
        in: path
        description: The action id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionTransitionResult'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/actions/{actionId}/executions:
    post:
      tags:
      - Actions
      summary: Have Jam do an action
      description: 'Ask Jam to do the work. An action linked to an article is drafted in the background. Other work, and the `agent` mode, is not available in this build: 422 names the reason, and `agentPrompt` tells your agent what to do. 409 when the article is held, dismissed or written.'
      operationId: create_action_execution
      parameters:
      - name: actionId
        in: path
        description: The action id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionExecutionRequest'
        required: true
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionExecution'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/actions/{actionId}/sent:
    post:
      tags:
      - Actions
      summary: Report an outreach pitch sent
      description: 'Outreach only: the pitch went out; the third party has not acted yet (status `sent`). 422 for any other kind. Safe to repeat.'
      operationId: report_action_sent
      parameters:
      - name: actionId
        in: path
        description: The action id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionTransitionResult'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/actions/{actionId}/start:
    post:
      tags:
      - Actions
      summary: Start an action
      description: Record that work on the action has begun (status `in_progress`). To take a started action off the Plan, dismiss it. Safe to repeat.
      operationId: start_action
      parameters:
      - name: actionId
        in: path
        description: The action id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionTransitionResult'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/agent-connect:
    post:
      tags:
      - Agent connect
      summary: Start an agent connect session
      operationId: start_agent_connect
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: 'null'
              - $ref: '#/components/schemas/StartConnect'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectStarted'
        '429':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
  /v1/agent-connect/{pollToken}:
    get:
      tags:
      - Agent connect
      summary: Poll an agent connect session
      operationId: get_agent_connect
      parameters:
      - name: pollToken
        in: path
        description: The `pollToken` from the start call
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectStatus'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
  /v1/analytics/metrics:
    get:
      tags:
      - Analytics
      summary: One metric family as flat rows, for charts
      operationId: list_analytics_metrics
      parameters:
      - name: metric
        in: query
        description: The metric family to flatten into rows.
        required: true
        schema:
          $ref: '#/components/schemas/MetricKind'
      - name: rangeDays
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: projectId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: platform
        in: query
        description: One engine, for example `openai`. Applies to `visibility`, `competitors`, `citations` and `topics`.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricRows'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/analytics/overview:
    get:
      tags:
      - Analytics
      summary: Visibility, share of voice, citations and position for a window
      operationId: get_analytics_overview
      parameters:
      - name: rangeDays
        in: query
        description: Days in the window, 1 to 365. The default is 30.
        required: false
        schema:
          type: integer
          format: int64
      - name: projectId
        in: query
        description: The project to measure. The default is the newest project.
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverview'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/analytics/prompts:
    get:
      tags:
      - Analytics
      summary: Metrics for each tracked prompt
      operationId: list_prompt_analytics
      parameters:
      - name: rangeDays
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: projectId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: Page size, 1 to 100. The default is 25.
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        description: '`nextCursor` of the page before.'
        required: false
        schema:
          type: string
      - name: intent
        in: query
        required: false
        schema:
          type: string
      - name: topic
        in: query
        required: false
        schema:
          type: string
      - name: platform
        in: query
        description: One engine, for example `openai`.
        required: false
        schema:
          type: string
      - name: query
        in: query
        description: Text the prompt contains. Case is ignored.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptAnalytics'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/answers:
    get:
      tags:
      - Answers
      summary: List answers
      operationId: list_answers
      parameters:
      - name: promptId
        in: query
        description: Only answers to this prompt.
        required: false
        schema:
          type: string
          format: uuid
      - name: platform
        in: query
        description: One engine, for example `openai`.
        required: false
        schema:
          type: string
      - name: since
        in: query
        description: Only answers observed at or after this time (RFC 3339).
        required: false
        schema:
          type: string
          format: date-time
      - name: until
        in: query
        description: Only answers observed at or before this time (RFC 3339).
        required: false
        schema:
          type: string
          format: date-time
      - name: cited
        in: query
        description: '`true`: answers that cite the project''s domain. `false`: answers that do not.'
        required: false
        schema:
          type: boolean
      - name: competitor
        in: query
        description: Only answers that mention this competitor.
        required: false
        schema:
          type: string
      - name: full
        in: query
        description: '`true`: the whole answer text. The default is a short excerpt.'
        required: false
        schema:
          type: boolean
      - name: limit
        in: query
        description: Page size, 1 to 100. The default is 25.
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        description: '`nextCursor` of the page before.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerPage'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/api-keys:
    get:
      tags:
      - API keys
      summary: List API keys
      operationId: list_api_keys
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyList'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
    post:
      tags:
      - API keys
      summary: Create an API key
      operationId: create_api_key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueApiKey'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedApiKey'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/api-keys/{keyId}:
    delete:
      tags:
      - API keys
      summary: Revoke an API key
      operationId: revoke_api_key
      parameters:
      - name: keyId
        in: path
        description: The key to revoke
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Revoked
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/billing:
    get:
      tags:
      - Billing
      summary: Get /v1/billing (not built yet)
      operationId: get_billing
      responses:
        '501':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/brand:
    get:
      tags:
      - Brand
      summary: Get /v1/brand (not built yet)
      operationId: get_brand
      responses:
        '501':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
    patch:
      tags:
      - Brand
      summary: Patch /v1/brand (not built yet)
      operationId: update_brand
      responses:
        '501':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/brand/competitors:
    get:
      tags:
      - Brand
      summary: Get /v1/brand/competitors (not built yet)
      operationId: list_brand_competitors
      responses:
        '501':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
    put:
      tags:
      - Brand
      summary: Put /v1/brand/competitors (not built yet)
      operationId: pin_competitors
      responses:
        '501':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
    post:
      tags:
      - Brand
      summary: Post /v1/brand/competitors (not built yet)
      operationId: add_brand_competitors
      responses:
        '501':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
    delete:
      tags:
      - Brand
      summary: Delete /v1/brand/competitors (not built yet)
      operationId: unpin_competitors
      responses:
        '501':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/brand/competitors/{name}:
    delete:
      tags:
      - Brand
      summary: Delete /v1/brand/competitors/{name} (not built yet)
      operationId: remove_brand_competitor
      parameters:
      - name: name
        in: path
        description: Path parameter
        required: true
        schema:
          type: string
      responses:
        '501':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
    patch:
      tags:
      - Brand
      summary: Patch /v1/brand/competitors/{name} (not built yet)
      operationId: update_brand_competitor
      parameters:
      - name: name
        in: path
        description: Path parameter
        required: true
        schema:
          type: string
      responses:
        '501':
