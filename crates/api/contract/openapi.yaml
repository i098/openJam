components:
  schemas:
    Accepted:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: Always `accepted`.
    AcceptedDelivery:
      type: object
      required:
      - status
      - deliveryId
      properties:
        deliveryId:
          type: string
          format: uuid
          description: The delivery to follow under `/v1/content/{contentId}/deliveries`.
        status:
          type: string
          description: Always `accepted`.
    AddDestination:
      type: object
      required:
      - platform
      properties:
        platform:
          type: string
          description: Only `github`.
    AddRevision:
      type: object
      required:
      - article
      properties:
        article:
          $ref: '#/components/schemas/Article'
        basisRevisionId:
          type:
          - string
          - 'null'
          format: uuid
          description: The revision this one was written from, if any.
        bundleId:
          type:
          - string
          - 'null'
          format: uuid
          description: The evidence bundle it was written from, if any.
    AddedDestination:
      type: object
      required:
      - destinationId
      properties:
        destinationId:
          type: string
          format: uuid
    AddedRevision:
      type: object
      required:
      - revisionId
      properties:
        revisionId:
          type: string
          format: uuid
    AnalyticsBrand:
      type: object
      required:
      - key
      - name
      - isOwned
      properties:
        domain:
          type:
          - string
          - 'null'
        isOwned:
          type: boolean
        key:
          type: string
        name:
          type: string
    AnalyticsOverview:
      type: object
      required:
      - project
      - selection
      - metricSource
      - metricDefinitions
      - window
      - providers
      - overview
      - trackedPrompts
      - promptsTracked
      - promptsMeasured
      properties:
        lastScanAt:
          type:
          - string
          - 'null'
          format: date-time
        metricDefinitions:
          $ref: '#/components/schemas/MetricDefinitions'
        metricSource:
          type: string
        nextScanAt:
          type:
          - string
          - 'null'
          format: date-time
        overview:
          $ref: '#/components/schemas/AnalyticsOverviewSection'
        project:
          $ref: '#/components/schemas/AnalyticsProject'
        promptsMeasured:
          type: integer
          format: int64
          minimum: 0
        promptsTracked:
          type: integer
          format: int64
          minimum: 0
        providers:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsPlatform'
        selection:
          $ref: '#/components/schemas/AnalyticsSelection'
        trackedPrompts:
          type: integer
          format: int64
          minimum: 0
        window:
          $ref: '#/components/schemas/AnalyticsWindow'
    AnalyticsOverviewSection:
      type: object
      required:
      - visibilityScore
      - shareOfVoice
      - citationShare
      - averagePosition
      - trend
      - leaderboard
      - providerBreakdown
      - changeFeed
      - topicRankings
      properties:
        averagePosition:
          $ref: '#/components/schemas/MetricValue'
        changeFeed:
          type: array
          items:
            $ref: '#/components/schemas/ChangeFeedItem'
        citationShare:
          $ref: '#/components/schemas/MetricValue'
        leaderboard:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
        providerBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/PlatformBreakdownRow'
        shareOfVoice:
          $ref: '#/components/schemas/MetricValue'
        topicRankings:
          type: array
          items:
            $ref: '#/components/schemas/TopicRanking'
        trend:
          $ref: '#/components/schemas/TrendSeries'
        visibilityScore:
          $ref: '#/components/schemas/MetricValue'
    AnalyticsPlatform:
      type: object
      required:
      - id
      - label
      - displayName
      - status
      properties:
        displayName:
          type: string
        id:
          type: string
        label:
          type: string
        status:
          type: string
          description: '`active` when the window has answers, `pending` when it has none.'
    AnalyticsProject:
      type: object
      required:
      - id
      - brandName
      - siteDomain
      - status
      properties:
        bootstrapCompletedAt:
          type:
          - string
          - 'null'
          format: date-time
        brandName:
          type: string
        id:
          type: string
          format: uuid
        lastVisibilitySuccessAt:
          type:
          - string
          - 'null'
          format: date-time
        siteDomain:
          type: string
        status:
          type: string
    AnalyticsSelection:
      type: object
      required:
      - range
      - providerIds
      - segmentIds
      properties:
        providerIds:
          type: array
          items:
            type: string
        range:
          type: string
        segmentIds:
          type: array
          items:
            type: string
    AnalyticsWindow:
      type: object
      required:
      - label
      - comparisonLabel
      - startDate
      - endDate
      - answerCount
      - providerCount
      properties:
        answerCount:
          type: integer
          format: int64
          minimum: 0
        comparisonLabel:
          type: string
        endDate:
          type: string
        label:
          type: string
        providerCount:
          type: integer
          format: int64
          minimum: 0
        startDate:
          type: string
    Answer:
      type: object
      required:
      - id
      - runId
      - promptId
      - platform
      - observedAt
      - answer
      - brandsMentioned
      - citedUrls
      - citedUrlCount
      properties:
        answer:
          $ref: '#/components/schemas/AnswerText'
        brandMentioned:
          type:
          - boolean
          - 'null'
        brandRecommended:
          type:
          - boolean
          - 'null'
        brandsMentioned:
          type: array
          items:
            $ref: '#/components/schemas/AnswerBrand'
        citedUrlCount:
          type: integer
          minimum: 0
        citedUrls:
          type: array
          items:
            type: string
        id:
          type: string
          format: uuid
        observedAt:
          type: string
          format: date-time
        ownDomainCited:
          type:
          - boolean
          - 'null'
        platform:
          type: string
        position:
          type:
          - integer
          - 'null'
          format: int32
        promptId:
          type: string
          format: uuid
        promptStatus:
          type:
          - string
          - 'null'
        promptText:
          type:
          - string
          - 'null'
        runId:
          type: string
          format: uuid
        sentiment:
          type:
          - string
          - 'null'
    AnswerBrand:
      type: object
      required:
      - name
      - owned
      properties:
        listRank:
          type:
          - integer
          - 'null'
          format: int32
        name:
          type: string
        owned:
          type: boolean
        recommended:
          type:
          - boolean
          - 'null'
        sentiment:
