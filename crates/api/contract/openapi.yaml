          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
  /v1/content/{contentId}/destinations/{destinationId}:
    put:
      tags:
      - Publishing
      summary: Publish content to a destination
      operationId: publish_content
      parameters:
      - name: contentId
        in: path
        description: The content item
        required: true
        schema:
          type: string
          format: uuid
      - name: destinationId
        in: path
        description: The destination
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Publish'
        required: true
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedDelivery'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '409':
          description: ''
          content:
            application/json:
