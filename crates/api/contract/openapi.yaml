components:
  schemas:
    AnalyticsBrand:
      type: object
      required:
      - key
      - name
      - isOwned
      properties:
        domain:
          type:
          - string
          - 'null'
        isOwned:
          type: boolean
        key:
          type: string
        name:
          type: string
    AnalyticsOverview:
      type: object
      required:
      - project
      - selection
      - metricSource
      - metricDefinitions
      - window
      - providers
      - overview
      - trackedPrompts
      - promptsTracked
      - promptsMeasured
      properties:
        lastScanAt:
          type:
          - string
          - 'null'
          format: date-time
        metricDefinitions:
          $ref: '#/components/schemas/MetricDefinitions'
        metricSource:
          type: string
        nextScanAt:
          type:
          - string
          - 'null'
          format: date-time
        overview:
          $ref: '#/components/schemas/AnalyticsOverviewSection'
        project:
          $ref: '#/components/schemas/AnalyticsProject'
        promptsMeasured:
          type: integer
          format: int64
          minimum: 0
        promptsTracked:
          type: integer
          format: int64
          minimum: 0
        providers:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsPlatform'
        selection:
          $ref: '#/components/schemas/AnalyticsSelection'
        trackedPrompts:
          type: integer
          format: int64
          minimum: 0
        window:
          $ref: '#/components/schemas/AnalyticsWindow'
    AnalyticsOverviewSection:
      type: object
      required:
      - visibilityScore
      - shareOfVoice
      - citationShare
      - averagePosition
      - trend
      - leaderboard
      - providerBreakdown
      - changeFeed
      - topicRankings
      properties:
        averagePosition:
          $ref: '#/components/schemas/MetricValue'
        changeFeed:
          type: array
          items:
            $ref: '#/components/schemas/ChangeFeedItem'
        citationShare:
          $ref: '#/components/schemas/MetricValue'
        leaderboard:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
        providerBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/PlatformBreakdownRow'
        shareOfVoice:
          $ref: '#/components/schemas/MetricValue'
        topicRankings:
          type: array
          items:
            $ref: '#/components/schemas/TopicRanking'
        trend:
          $ref: '#/components/schemas/TrendSeries'
        visibilityScore:
          $ref: '#/components/schemas/MetricValue'
    AnalyticsPlatform:
      type: object
      required:
      - id
      - label
      - displayName
      - status
      properties:
        displayName:
          type: string
        id:
          type: string
        label:
          type: string
        status:
          type: string
          description: '`active` when the window has answers, `pending` when it has none.'
    AnalyticsProject:
      type: object
      required:
      - id
      - brandName
      - siteDomain
      - status
      properties:
        bootstrapCompletedAt:
          type:
          - string
          - 'null'
          format: date-time
        brandName:
          type: string
        id:
          type: string
          format: uuid
        lastVisibilitySuccessAt:
          type:
          - string
          - 'null'
          format: date-time
        siteDomain:
          type: string
        status:
          type: string
    AnalyticsSelection:
      type: object
      required:
      - range
      - providerIds
      - segmentIds
      properties:
        providerIds:
          type: array
          items:
            type: string
        range:
          type: string
        segmentIds:
          type: array
          items:
            type: string
    AnalyticsWindow:
      type: object
      required:
      - label
      - comparisonLabel
      - startDate
      - endDate
      - answerCount
      - providerCount
      properties:
        answerCount:
          type: integer
          format: int64
          minimum: 0
        comparisonLabel:
          type: string
        endDate:
          type: string
        label:
          type: string
        providerCount:
          type: integer
          format: int64
          minimum: 0
        startDate:
          type: string
    Answer:
      type: object
      required:
      - id
      - runId
      - promptId
      - platform
      - observedAt
      - answer
      - brandsMentioned
      - citedUrls
      - citedUrlCount
      properties:
        answer:
          $ref: '#/components/schemas/AnswerText'
        brandMentioned:
          type:
          - boolean
          - 'null'
        brandRecommended:
          type:
          - boolean
          - 'null'
        brandsMentioned:
          type: array
          items:
            $ref: '#/components/schemas/AnswerBrand'
        citedUrlCount:
          type: integer
          minimum: 0
        citedUrls:
          type: array
          items:
            type: string
        id:
          type: string
          format: uuid
        observedAt:
          type: string
          format: date-time
        ownDomainCited:
          type:
          - boolean
          - 'null'
        platform:
          type: string
        position:
          type:
          - integer
          - 'null'
          format: int32
        promptId:
          type: string
          format: uuid
        promptStatus:
          type:
          - string
          - 'null'
        promptText:
          type:
          - string
          - 'null'
        runId:
          type: string
          format: uuid
        sentiment:
          type:
          - string
          - 'null'
    AnswerBrand:
      type: object
      required:
      - name
      - owned
      properties:
        listRank:
          type:
          - integer
          - 'null'
          format: int32
        name:
          type: string
        owned:
          type: boolean
        recommended:
          type:
          - boolean
          - 'null'
        sentiment:
          type:
          - string
          - 'null'
    AnswerPage:
      type: object
      required:
      - answers
      - pageInfo
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/Answer'
        nextCursor:
          type:
          - string
          - 'null'
        pageInfo:
          $ref: '#/components/schemas/AnswerPageInfo'
    AnswerPageInfo:
      type: object
      required:
      - limit
      - hasNextPage
      properties:
        hasNextPage:
          type: boolean
        limit:
          type: integer
          format: int64
        nextCursor:
          type:
          - string
          - 'null'
    AnswerText:
      type: object
      required:
      - source
      - truncated
      - length
      properties:
        length:
          type: integer
          description: Characters in the whole answer.
          minimum: 0
        source:
          type: string
          description: '`full` or `excerpt`.'
        text:
          type:
          - string
          - 'null'
        truncated:
          type: boolean
    ApiErrorBody:
      type: object
      description: The body of every failed `/v1` call. Shape kept from the source API.
      required:
      - error
      - code
      - request_id
      - docs
      properties:
        code:
          type: string
          description: Stable machine-readable code.
        docs:
          type: string
          description: Where the error codes are documented.
        error:
          type: string
          description: What went wrong and how to fix the request.
        request_id:
          type: string
          format: uuid
          description: Quote it to support.
    ApiKeyList:
      type: object
      required:
      - keys
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeySummary'
    ApiKeySummary:
      type: object
      required:
      - id
      - name
      - keyPrefix
      - createdAt
      properties:
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        keyPrefix:
          type: string
        lastUsedAt:
          type:
          - string
          - 'null'
          format: date-time
        name:
          type: string
        revokedAt:
          type:
          - string
          - 'null'
          format: date-time
    ChangeFeedItem:
      type: object
      required:
      - kind
      - providerId
      - value
      - delta
      properties:
        delta:
          type: number
          format: double
        kind:
          type: string
          description: '`visibility_up` or `visibility_down`.'
        providerId:
          type: string
        value:
          type: number
          format: double
    CreateProject:
      type: object
      required:
      - name
      - domain
      properties:
        domain:
          type: string
          description: Host name, for example `acme.com`.
        name:
          type: string
        siteUrl:
          type:
          - string
          - 'null'
    IssueApiKey:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: A name to recognize the key later.
    IssuedApiKey:
      type: object
      required:
      - id
      - key
      - keyPrefix
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: Shown once. Store it now; the server keeps only its hash.
        keyPrefix:
          type: string
    LeaderboardEntry:
      type: object
      required:
      - brand
      - mentions
      properties:
        averagePosition:
          type:
          - number
          - 'null'
          format: double
        brand:
          $ref: '#/components/schemas/AnalyticsBrand'
        citationShare:
          type:
          - number
          - 'null'
          format: double
        delta:
          type:
          - number
          - 'null'
          format: double
        mentions:
          type: integer
          format: int64
        rank:
          type:
          - integer
          - 'null'
          format: int64
        shareOfVoice:
          type:
          - number
          - 'null'
          format: double
        visibilityScore:
          type:
          - number
          - 'null'
          format: double
    Me:
      type: object
      required:
      - user
      - workspace_id
      properties:
        project:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/MeProject'
        user:
          $ref: '#/components/schemas/MeUser'
        workspace_id:
          type: string
          format: uuid
    MeProject:
      type: object
      required:
      - id
      - domain
      properties:
        domain:
          type: string
        id:
          type: string
          format: uuid
    MeUser:
      type: object
      required:
      - id
      - email
      properties:
        email:
          type: string
        id:
          type: string
          format: uuid
        name:
          type:
          - string
          - 'null'
    MetricDefinitions:
      type: object
      required:
      - percentages
      - prompts
      - visibility
      - citations
      - share_of_voice
      - position
      - scope
      - counts
      properties:
        citations:
          type: string
        counts:
          type: string
        percentages:
          type: string
        position:
          type: string
        prompts:
          type: string
        scope:
          type: string
        share_of_voice:
          type: string
        visibility:
          type: string
    MetricKind:
      type: string
      enum:
      - visibility
      - competitors
      - citations
      - platforms
      - topics
      - sources
    MetricRow:
      type: object
      description: One row of a metric family. Each family fills the fields that apply to it.
      properties:
        answerCount:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        answerShare:
          type:
          - number
          - 'null'
          format: double
          description: Answers that cite the domain, as a percent of all answers (`sources`).
        answers:
          type:
          - integer
          - 'null'
          format: int64
          description: Answers that cite the domain (`sources`).
          minimum: 0
        averagePosition:
          type:
          - number
          - 'null'
          format: double
        brand:
          type:
          - string
          - 'null'
        brandKey:
          type:
          - string
          - 'null'
        citationShare:
          type:
          - number
          - 'null'
          format: double
        citations:
          type:
          - integer
          - 'null'
          format: int64
          description: Citations of the domain (`sources`).
          minimum: 0
        date:
          type:
          - string
          - 'null'
        domain:
          type:
          - string
          - 'null'
        isOwned:
          type:
          - boolean
          - 'null'
        mentions:
          type:
          - integer
          - 'null'
          format: int64
        platform:
          type:
          - string
          - 'null'
        promptCount:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        rank:
          type:
          - integer
          - 'null'
          format: int64
        shareOfVoice:
          type:
          - number
          - 'null'
          format: double
        status:
          type:
          - string
          - 'null'
        topic:
          type:
          - string
          - 'null'
        visibilityScore:
          type:
          - number
          - 'null'
          format: double
    MetricRows:
      type: object
      required:
      - metric
      - rows
      properties:
        metric:
          $ref: '#/components/schemas/MetricKind'
          description: 'The family asked for: `visibility`, `competitors`, `citations`, `platforms`, `topics` or `sources`.'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/MetricRow'
    MetricValue:
      type: object
      description: A metric in percent (`0` to `100`), or a mean position. The delta compares the window before.
      required:
      - deltaAvailable
      properties:
        delta:
          type:
          - number
          - 'null'
          format: double
          description: The change against the previous window. `null` when a side has no data.
        deltaAvailable:
          type: boolean
          description: False when the current or the previous window has no data.
        value:
          type:
          - number
          - 'null'
          format: double
          description: '`null` when the window has no answers to measure.'
    PageInfo:
      type: object
      required:
      - limit
      - hasNextPage
      - totalCount
      properties:
        hasNextPage:
          type: boolean
        limit:
          type: integer
          format: int64
        nextCursor:
          type:
          - string
          - 'null'
        totalCount:
          type: integer
          format: int64
          minimum: 0
    PlatformBreakdownRow:
      type: object
      required:
      - providerId
      - visibilityScore
      - shareOfVoice
      - citationShare
      - averagePosition
      - answerCount
      - status
      properties:
        answerCount:
          type: integer
          format: int64
          minimum: 0
        averagePosition:
          $ref: '#/components/schemas/MetricValue'
        citationShare:
          $ref: '#/components/schemas/MetricValue'
        providerId:
          type: string
        shareOfVoice:
          $ref: '#/components/schemas/MetricValue'
        status:
          type: string
        visibilityScore:
          $ref: '#/components/schemas/MetricValue'
    ProjectList:
      type: object
      required:
      - projects
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
    ProjectSummary:
      type: object
      required:
      - id
      - name
      - domain
      - siteUrl
      - status
      - createdAt
      properties:
        createdAt:
          type: string
          format: date-time
        domain:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
        siteUrl:
          type: string
        status:
          type: string
          description: '`setup`, `active`, `paused` or `blocked`.'
    PromptAnalytics:
      type: object
      required:
      - project
      - window
      - providers
      - metricDefinitions
      - prompts
      - filters
      - pageInfo
      properties:
        filters:
          $ref: '#/components/schemas/PromptFilters'
        metricDefinitions:
          $ref: '#/components/schemas/MetricDefinitions'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
        project:
          $ref: '#/components/schemas/AnalyticsProject'
        prompts:
          type: array
          items:
            $ref: '#/components/schemas/PromptRow'
        providers:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsPlatform'
        window:
          $ref: '#/components/schemas/AnalyticsWindow'
    PromptFilters:
      type: object
      properties:
        intent:
          type:
          - string
          - 'null'
        platform:
          type:
          - string
          - 'null'
        query:
          type:
          - string
          - 'null'
        topic:
          type:
          - string
          - 'null'
    PromptMetrics:
      type: object
      required:
      - visibilityScore
      - shareOfVoice
      - averagePosition
      - citationShare
      - executions
      properties:
        averagePosition:
          $ref: '#/components/schemas/MetricValue'
        citationRank:
          type:
          - integer
          - 'null'
          format: int64
        citationShare:
          $ref: '#/components/schemas/MetricValue'
        executions:
          type: integer
          format: int64
          minimum: 0
        shareOfVoice:
          $ref: '#/components/schemas/MetricValue'
        visibilityRank:
          type:
          - integer
          - 'null'
          format: int64
        visibilityScore:
          $ref: '#/components/schemas/MetricValue'
    PromptRow:
      type: object
      required:
      - id
      - text
      - metrics
      properties:
        id:
          type: string
          format: uuid
        intent:
          type:
          - string
          - 'null'
        metrics:
          $ref: '#/components/schemas/PromptMetrics'
        persona:
          type:
          - string
          - 'null'
        text:
          type: string
        topic:
          type:
          - string
          - 'null'
    TopicRanking:
      type: object
      required:
      - topic
      - promptCount
      - answerCount
      - visibilityScore
      properties:
        answerCount:
          type: integer
          format: int64
          minimum: 0
        promptCount:
          type: integer
          format: int64
          minimum: 0
        topic:
          type: string
        visibilityScore:
          $ref: '#/components/schemas/MetricValue'
    TrendPoint:
      type: object
      required:
      - date
      - scores
      properties:
        date:
          type: string
          description: UTC day, `YYYY-MM-DD`.
        scores:
          type: object
          description: Mention rate of each brand on that day, by brand key.
          additionalProperties:
            type: number
            format: double
          propertyNames:
            type: string
    TrendSeries:
      type: object
      required:
      - brands
      - points
      - unit
      properties:
        brands:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsBrand'
        points:
          type: array
          items:
            $ref: '#/components/schemas/TrendPoint'
        unit:
          type: string
    Usage:
      type: object
      required:
      - scans_today
      - cost_cents_today
      - cost_cents_month
      properties:
        cost_cents_month:
          type: number
          format: double
        cost_cents_today:
          type: number
          format: double
        scan_cap_per_day:
          type:
          - integer
          - 'null'
          format: int32
          description: '`null` when no cap is set. The default is no cap.'
          minimum: 0
        scans_today:
          type: integer
          format: int64
          description: Scans started in the current UTC day.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sk
