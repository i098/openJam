  /v1/brand/competitors/{name}:
    delete:
      tags:
      - Brand
      summary: Delete /v1/brand/competitors/{name} (not built yet)
      operationId: remove_brand_competitor
      parameters:
      - name: name
        in: path
        description: Path parameter
        required: true
        schema:
          type: string
      responses:
        '501':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      security:
      - bearerAuth: []
    patch:
      tags:
      - Brand
      summary: Patch /v1/brand/competitors/{name} (not built yet)
      operationId: update_brand_competitor
      parameters:
      - name: name
        in: path
        description: Path parameter
        required: true
        schema:
          type: string
      responses:
        '501':
          description: ''
          content:
            application/json:
