components:
  schemas:
    ApiErrorBody:
      type: object
      description: The body of every failed `/v1` call. Shape kept from the source API.
      required:
      - error
      - code
      - request_id
      - docs
      properties:
        code:
          type: string
          description: Stable machine-readable code.
        docs:
          type: string
          description: Where the error codes are documented.
        error:
          type: string
          description: What went wrong and how to fix the request.
        request_id:
          type: string
          format: uuid
          description: Quote it to support.
    ApiKeyList:
      type: object
      required:
      - keys
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeySummary'
    ApiKeySummary:
      type: object
      required:
      - id
      - name
      - keyPrefix
      - createdAt
      properties:
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        keyPrefix:
          type: string
        lastUsedAt:
          type:
          - string
          - 'null'
          format: date-time
        name:
          type: string
        revokedAt:
          type:
          - string
          - 'null'
          format: date-time
    CreateProject:
      type: object
      required:
      - name
      - domain
      properties:
        domain:
          type: string
          description: Host name, for example `acme.com`.
        name:
          type: string
        siteUrl:
          type:
          - string
          - 'null'
    IssueApiKey:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: A name to recognize the key later.
    IssuedApiKey:
      type: object
      required:
      - id
      - key
      - keyPrefix
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: Shown once. Store it now; the server keeps only its hash.
        keyPrefix:
          type: string
    Me:
      type: object
      required:
      - user
      - workspace_id
      properties:
        project:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/MeProject'
        user:
          $ref: '#/components/schemas/MeUser'
        workspace_id:
          type: string
          format: uuid
    MeProject:
      type: object
      required:
      - id
      - domain
      properties:
        domain:
          type: string
        id:
          type: string
          format: uuid
    MeUser:
      type: object
      required:
      - id
      - email
      properties:
        email:
          type: string
        id:
          type: string
          format: uuid
        name:
          type:
          - string
          - 'null'
    ProjectList:
      type: object
      required:
      - projects
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
    ProjectSummary:
      type: object
      required:
      - id
      - name
      - domain
      - siteUrl
      - status
      - createdAt
      properties:
        createdAt:
          type: string
          format: date-time
        domain:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
        siteUrl:
          type: string
        status:
          type: string
          description: '`setup`, `active`, `paused` or `blocked`.'
    Usage:
      type: object
      required:
      - scans_today
      - cost_cents_today
      - cost_cents_month
      properties:
        cost_cents_month:
          type: number
          format: double
        cost_cents_today:
          type: number
          format: double
        scan_cap_per_day:
          type:
          - integer
          - 'null'
          format: int32
          description: '`null` when no cap is set. The default is no cap.'
          minimum: 0
        scans_today:
          type: integer
          format: int64
          description: Scans started in the current UTC day.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sk
