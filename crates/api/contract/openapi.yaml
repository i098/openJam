          - 'null'
          format: date-time
          description: When to publish, as an ISO-8601 timestamp.
        when:
          type:
          - string
          - 'null'
          description: Send `"now"` to publish now. Send this or `publishAt`, not both.
    QuietHours:
      type: object
      required:
      - start
      - end
      - timezone
      properties:
        end:
          type: string
          description: Local time, `HH:MM`. Earlier than `start` means the window crosses midnight.
        start:
          type: string
          description: Local time, `HH:MM`.
        timezone:
          type: string
          description: An IANA zone, for example `Europe/Berlin`.
    RegenerateContent:
      type: object
      required:
      - basisRevisionId
      properties:
        basisRevisionId:
          type: string
          format: uuid
          description: The revision being replaced, normally the current one.
    Revision:
      allOf:
      - $ref: '#/components/schemas/RevisionSummary'
      - type: object
        required:
        - contentId
        - article
        properties:
          article:
            $ref: '#/components/schemas/Article'
          contentId:
            type: string
            format: uuid
    RevisionSummary:
      type: object
      required:
      - id
      - title
      - source
      - findings
      - needsReview
      - createdAt
      properties:
        basisRevisionId:
          type:
          - string
          - 'null'
          format: uuid
        createdAt:
          type: string
          format: date-time
        evidenceBundleId:
          type:
          - string
          - 'null'
          format: uuid
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        id:
          type: string
          format: uuid
        needsReview:
          type: boolean
        source:
          type: string
          description: 'Who wrote it: `pipeline` (openJam), `human` or `agent`.'
        title:
          type: string
    Revisions:
      type: object
      required:
      - revisions
      properties:
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/RevisionSummary'
    StartConnect:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: Shown on the approval page, for example `Claude Code`.
    TopicRanking:
      type: object
      required:
      - topic
      - promptCount
      - answerCount
      - visibilityScore
      properties:
        answerCount:
          type: integer
          format: int64
          minimum: 0
        promptCount:
          type: integer
          format: int64
          minimum: 0
        topic:
          type: string
        visibilityScore:
          $ref: '#/components/schemas/MetricValue'
    TrendPoint:
      type: object
      required:
      - date
      - scores
      properties:
        date:
          type: string
          description: UTC day, `YYYY-MM-DD`.
        scores:
          type: object
          description: Mention rate of each brand on that day, by brand key.
          additionalProperties:
            type: number
            format: double
          propertyNames:
            type: string
    TrendSeries:
      type: object
      required:
      - brands
      - points
      - unit
      properties:
        brands:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsBrand'
        points:
          type: array
          items:
            $ref: '#/components/schemas/TrendPoint'
        unit:
          type: string
    UpdateFailure:
      type: object
      required:
      - code
      - message
      - at
      properties:
        at:
          type: string
          format: date-time
        code:
          type: string
          description: '`insufficient_credits`, `agent_failed` or `failed`.'
        message:
          type: string
    UpdateNotificationRule:
      type: object
      properties:
        batchWindowMinutes:
          type:
          - integer
          - 'null'
          format: int32
        batchingEnabled:
          type:
          - boolean
          - 'null'
        channels:
          type:
          - array
          - 'null'
          items:
            type: string
        isActive:
          type:
          - boolean
          - 'null'
        quietHours:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/QuietHours'
            description: An object sets quiet hours. `null` clears them. Leave it out to keep them.
    UpdateWebhook:
      type: object
      properties:
        enabled:
          type:
          - boolean
          - 'null'
        name:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
    Usage:
      type: object
      required:
      - scans_today
      - cost_cents_today
      - cost_cents_month
      properties:
        cost_cents_month:
          type: number
          format: double
        cost_cents_today:
          type: number
          format: double
        scan_cap_per_day:
          type:
          - integer
          - 'null'
          format: int32
          description: '`null` when no cap is set. The default is no cap.'
          minimum: 0
        scans_today:
          type: integer
          format: int64
          description: Scans started in the current UTC day.
    Webhook:
      type: object
      required:
      - id
      - name
      - url
      - enabled
      - createdAt
      properties:
        createdAt:
          type: string
          format: date-time
        enabled:
          type: boolean
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
    WebhookList:
      type: object
      required:
      - webhooks
      properties:
        webhooks:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sk
