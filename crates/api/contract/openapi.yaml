      tags:
      - Publishing
      summary: Content's destinations
      operationId: list_content_destinations
      parameters:
      - name: contentId
        in: path
        description: The content item
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentDestinations'
        '401':
