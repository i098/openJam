name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openjam
          POSTGRES_PASSWORD: openjam
          POSTGRES_DB: openjam
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openjam" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://openjam:openjam@localhost:5432/openjam
      RUST_LOG: warn
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p openjam-api --bin openjam-openapi -- --check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run check
        working-directory: web
      - run: bun run gen:types && git diff --exit-code -- src/lib/api-types.ts
        working-directory: web
      - run: bun run build
        working-directory: web

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/healthz && exit 0
            sleep 5
          done
          docker compose logs; exit 1
      - run: docker compose down -v
        if: always()
